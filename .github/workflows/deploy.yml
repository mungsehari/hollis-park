# Test, build (linux/arm64) and roll the ECS service on every push to main.
# AWS access is OIDC (no stored keys). One-time setup: deploy/aws/README.md, "GitHub Actions".
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  # Not a secret: the role only trusts this repository's main branch (see deploy/aws/template.yaml).
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::730335301258:role/store-GitHubDeployRole-ClVZUaFWGiJC' }}
  ECS_CLUSTER: store-Cluster-O85wbQUMEGVX
  ECS_SERVICE: store-Service-FPAjPY6xuMQZ
  API_REPO: store-apirepo-4ipvdbbpsmwg
  WEB_REPO: store-webrepo-zucryauc3j31

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Backend tests (embedded PostgreSQL)
        working-directory: backend
        run: mvn -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
        with: {platforms: arm64}
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPO }}:gh-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.API_REPO }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push the web image (store + admin)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web.Dockerfile
          build-args: NGINX_CONF=deploy/nginx.aws.conf
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPO }}:gh-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPO }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Roll the ECS service and wait until it is healthy
        run: |
          desired=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].desiredCount' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment > /dev/null
          if [ "$desired" = "0" ]; then
            # Starting from zero: let the new image become the only deployment first, then add a task.
            # Raising the count in the same call makes ECS also start an old task (to stay "100% healthy"),
            # and that old version would run its own database migrations.
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --desired-count 1 > /dev/null
          fi
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Released ${GITHUB_SHA::7}"
