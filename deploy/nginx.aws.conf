# Runs in the same ECS task as the API, so the API is reachable on localhost.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;   # admin image uploads (the API allows 8 MB each)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # API (store and admin), health probes and uploaded images go to Spring Boot.
  location ~ ^/(api|actuator|media)/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 30s;
  }

  location ~ ^/(admin/)?assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html       { add_header Cache-Control "no-cache"; }
  location = /admin/index.html { add_header Cache-Control "no-cache"; }

  location /admin/ { try_files $uri /admin/index.html; }
  location /       { try_files $uri /index.html; }
}
