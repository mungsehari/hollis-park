server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m;   # admin image uploads (the API allows 8 MB each)

  # API (store and admin) and uploaded images go to the Spring Boot container.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /media/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  # Hashed build assets can be cached for a year.
  location ~ ^/(admin/)?assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Admin panel routes (/admin/orders/HP-24001, ...) serve the admin app.
  location /admin/ {
    try_files $uri /admin/index.html;
  }

  # Store routes (/catalog/tide-one, /checkout, ...) serve the store app.
  location / {
    try_files $uri /index.html;
  }
}
