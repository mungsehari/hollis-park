# Production-like stack on your machine: PostgreSQL + Spring Boot API + nginx
# serving the store at / and the admin panel at /admin.
#   ADMIN_EMAIL=you@example.com ADMIN_PASSWORD='a-long-password' docker compose up --build
# then open http://localhost:8081 (store) and http://localhost:8081/admin
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store-local-only
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/store
      DB_USERNAME: store
      DB_PASSWORD: store-local-only
      SESSION_COOKIE_SECURE: "false"   # plain http on localhost
      MEDIA_STORAGE: local
      MEDIA_DIR: /data/media
    volumes:
      - media-data:/data/media
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  db-data:
  media-data:
