# Production (AWS RDS PostgreSQL). Everything sensitive comes from environment variables.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
  # Behind the load balancer and nginx: Tomcat itself reads X-Forwarded-For / -Proto from those private
  # addresses, so request.getRemoteAddr() is the real visitor (rate limits) and cookies are marked secure.
  forward-headers-strategy: native

# One JSON object per log line (CloudWatch Logs Insights can filter on any field, incl. requestId).
logging:
  structured:
    format:
      console: ecs
